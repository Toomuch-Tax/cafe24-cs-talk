name: 버그 신고
description: 동작이 이상하거나 오류가 나요
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 어떤 화면에서 무엇을 했더니 어떻게 됐는지. 오류 메시지·스크린샷이 있으면 붙여 주세요 (고객 개인정보는 가려 주세요).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
  - type: input
    id: env
    attributes:
      label: 환경
      description: "예: Vercel + Supabase / 로컬 docker, Node 22, 커밋 abc1234"
